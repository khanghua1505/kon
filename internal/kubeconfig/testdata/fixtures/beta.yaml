apiVersion: v1
kind: Config
current-context: beta-dev
x-vendor-extension:
  owner: platform-team
clusters:
- name: beta-cluster
  cluster:
    server: https://beta.example.com:6443
    certificate-authority: certs/beta-ca.crt
    tls-server-name: beta.internal
users:
- name: beta-user
  user:
    exec:
      apiVersion: client.authentication.k8s.io/v1beta1
      command: aws
      args:
      - eks
      - get-token
      - --cluster-name
      - beta
      env:
      - name: AWS_PROFILE
        value: beta
contexts:
- name: beta-dev
  context:
    cluster: beta-cluster
    user: beta-user
- name: beta-prod
  context:
    cluster: beta-cluster
    user: beta-user
    namespace: prod
