version: "2"

run:
  go: "1.23"

linters:
  exclusions:
    presets:
      - comments
    rules:
      - path: _test\.go
        linters:
          - errcheck
      # ST1005: error strings mirror upstream kon (Rust) user-visible text
      # verbatim; restyle would diverge from upstream behavior.
      - linters:
          - staticcheck
        text: "^ST1005:"
