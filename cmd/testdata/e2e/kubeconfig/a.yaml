apiVersion: v1
kind: Config
preferences: {}
unknown-top-level-field: keep-me
clusters:
- name: cluster-a
  cluster:
    server: https://cluster-a.example.test
    unknown-cluster-field: keep-me
- name: cluster-b
  cluster:
    server: https://cluster-b.example.test
users:
- name: user-a
  user:
    exec:
      apiVersion: client.authentication.k8s.io/v1beta1
      command: fake-credential-plugin
      args:
      - --cluster=cluster-a
- name: user-b
  user:
    token: user-b-token
contexts:
- name: ctx-a
  context:
    cluster: cluster-a
    user: user-a
- name: ctx-b
  context:
    cluster: cluster-b
    user: user-b
